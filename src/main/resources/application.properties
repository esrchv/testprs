# ==========================================================
# Application identity
# ==========================================================
spring.application.name=test-starter

# ==========================================================
# Runtime profile
# ==========================================================
# Example: local, dev, sit, uat, prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ==========================================================
# JNDI DataSource names (container-managed)
# ==========================================================
# Replace values with environment-specific JNDI locations.
# Do not place database credentials in this file.
testone.datasource.jndi-name=${TESTONE_DATASOURCE_JNDI_NAME:java:/comp/env/jdbc/testone}
testtwo.datasource.jndi-name=${TESTTWO_DATASOURCE_JNDI_NAME:java:/comp/env/jdbc/testtwo}

# ==========================================================
# Logging
# ==========================================================
# Set log file destination via environment variable when needed.
logging.file.name=${LOGGING_FILE_NAME:logs/test-starter.log}

# ==========================================================
# Server defaults
# ==========================================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ==========================================================
# OpenAPI / Swagger UI defaults
# ==========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
